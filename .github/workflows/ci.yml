name: 品質チェック

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 品質ゲート
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: 空白エラーを確認
        run: git diff --check

      - name: Goプロジェクトを確認
        id: go
        shell: bash
        run: |
          if [[ -f go.mod ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "go.modが見つからないため、Goプロジェクト初期化まではGo関連のチェックをスキップします。"
          fi

      - name: Goをセットアップ
        if: steps.go.outputs.enabled == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmtを確認
        if: steps.go.outputs.enabled == 'true'
        shell: bash
        run: |
          files="$(find . -type f -name '*.go' -not -path './vendor/*' -print)"
          if [[ -n "$files" ]]; then
            unformatted="$(gofmt -l $files)"
            if [[ -n "$unformatted" ]]; then
              echo "次のファイルがgofmtされていません:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Go vetを実行
        if: steps.go.outputs.enabled == 'true'
        run: go vet ./...

      - name: Goのテストを実行
        if: steps.go.outputs.enabled == 'true'
        run: go test ./...

      - name: Goをビルド
        if: steps.go.outputs.enabled == 'true'
        run: go build ./...
