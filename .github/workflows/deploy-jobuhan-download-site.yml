name: Deploy jobuhan download site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-jobuhan-download-site.yml"
      - "jobuhan-download-site/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: jobuhan-download-site
      - name: Wait for uploaded artifact to be available
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        with:
          script: |
            const artifactName = process.env.ARTIFACT_NAME;
            const maxAttempts = 12;

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              const artifacts = data.artifacts.filter(
                (artifact) => artifact.name === artifactName && !artifact.expired,
              );

              if (artifacts.length === 1) {
                core.info(`Artifact "${artifactName}" is available.`);
                return;
              }
              if (artifacts.length > 1) {
                throw new Error(`Found ${artifacts.length} artifacts named "${artifactName}".`);
              }

              core.info(`Artifact "${artifactName}" is not visible yet (${attempt}/${maxAttempts}).`);
              if (attempt < maxAttempts) {
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }

            throw new Error(`Artifact "${artifactName}" did not become available in time.`);
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
